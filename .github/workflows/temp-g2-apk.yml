name: Temporary G2 APK handoff

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK/NDK pieces
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore debug signing key
        id: debug-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: androidklipper-debug-keystore-v1

      - name: Create debug signing key on first run
        if: steps.debug-signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Vendor pinned Klipper
        run: bash scripts/vendor-klipper.sh

      - name: Vendor pinned Moonraker
        run: bash scripts/vendor-moonraker.sh

      - name: Static project checks
        run: python3 scripts/check-project.py

      - name: Unit tests and debug APK
        run: gradle --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Inspect packaged APK
        run: bash scripts/inspect-apk.sh

      - name: Publish temporary test APK as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="g2-usb-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "app/build/outputs/apk/debug/app-debug.apk#androidklipper-g2-usb-test.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AndroidKlipper G2 USB test ${GITHUB_RUN_NUMBER}" \
            --notes "Temporary reviewed USB transport test build."
