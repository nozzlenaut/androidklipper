name: Pico W setup benchmark

on:
  push:
    branches: [pico2w-bridge-poc]
    paths:
      - 'bridge/picow_setup/**'
      - '.github/workflows/picow-setup.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Checkout Pico SDK 2.3.1
        run: |
          git clone --depth 1 --branch 2.3.1 https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --recursive --depth 1

      - name: Build setup benchmark
        run: |
          cmake -S bridge/picow_setup -B bridge/picow_setup/build \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DPICO_BOARD=pico_w
          cmake --build bridge/picow_setup/build -j2

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: androidklipper-picow-setup-bench
          path: bridge/picow_setup/build/androidklipper_setup_bench.uf2
          if-no-files-found: error
          retention-days: 3
