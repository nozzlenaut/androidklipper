name: Android build

on:
  push:
    branches: [main]
    tags: ['androidklipper-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Keep one existing APK. GitHub quota accounting can lag deleted artifacts by hours.
      - name: Clean old Android build artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 1;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                name: 'androidklipper-debug-apk'
              }
            );

            const recent = artifacts
              .filter((artifact) => !artifact.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            core.info(`Found ${recent.length} AndroidKlipper APK artifacts; keeping ${keep} before this build.`);

            for (const artifact of recent.slice(keep)) {
              core.info(`Deleting artifact ${artifact.id} from ${artifact.created_at}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }

  build:
    needs: cleanup-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK/NDK pieces
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Debug signing key policy
      #
      # Android refuses an in-place update when the signing key changes, and
      # the only fix is uninstalling, which also deletes AndroidKlipperDrive
      # (config, Moonraker database, G-code). So the key must never be silently
      # regenerated.
      #
      # Preferred: store the keystore base64-encoded in the repo secret
      #   ANDROIDKLIPPER_DEBUG_KEYSTORE_B64
      # Fallback: the Actions cache (GitHub evicts caches unused for ~7 days).
      # Optional guard: set the repo variable ANDROIDKLIPPER_DEBUG_KEY_SHA256 to
      # the expected certificate fingerprint; the build then fails loudly
      # instead of shipping an APK signed by a different key.
      # See docs/SIGNING.md.
      - name: Install debug signing key from secret
        id: debug-signing-secret
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROIDKLIPPER_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "${DEBUG_KEYSTORE_B64:-}" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROIDKLIPPER_DEBUG_KEYSTORE_B64 is not set; falling back to the Actions cache for the debug key. If the cache is evicted, APKs stop updating in place. See docs/SIGNING.md."
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore debug signing key (cache fallback)
        id: debug-signing-cache
        if: steps.debug-signing-secret.outputs.installed != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: androidklipper-debug-keystore-v1

      - name: Create debug signing key on first run (cache fallback)
        if: steps.debug-signing-secret.outputs.installed != 'true' && steps.debug-signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Verify debug signing key
        env:
          EXPECTED_SHA256: ${{ vars.ANDROIDKLIPPER_DEBUG_KEY_SHA256 }}
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey > /tmp/keyinfo.txt
          grep -E 'Owner:|SHA256:' /tmp/keyinfo.txt
          if [ -n "${EXPECTED_SHA256:-}" ]; then
            actual="$(grep -m1 'SHA256:' /tmp/keyinfo.txt | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':[:space:]' | tr 'a-f' 'A-F')"
            expected="$(printf '%s' "$EXPECTED_SHA256" | tr -d ':[:space:]' | tr 'a-f' 'A-F')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Debug signing key fingerprint changed (expected $expected, got $actual). Refusing to build an APK that cannot update existing installs in place."
              exit 1
            fi
            echo "Debug signing key matches pinned fingerprint."
          else
            echo "::notice::ANDROIDKLIPPER_DEBUG_KEY_SHA256 is not set; key identity is not being pinned."
          fi

      - name: Vendor pinned Klipper
        run: bash scripts/vendor-klipper.sh

      - name: Vendor pinned Moonraker
        run: bash scripts/vendor-moonraker.sh

      - name: Static project checks
        run: python3 scripts/check-project.py

      - name: Script tests
        run: |
          python3 -m pip install pyyaml tornado importlib_metadata
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Native PTY bridge tests
        run: bash scripts/native-tests/run.sh

      - name: Unit tests and debug APK
        run: gradle --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Inspect packaged APK
        run: bash scripts/inspect-apk.sh

      - name: Upload debug APK
        id: upload-debug-apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: androidklipper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Warn if GitHub artifact quota blocked upload
        if: steps.upload-debug-apk.outcome == 'failure'
        run: |
          echo "::warning::APK build/tests/inspection passed, but GitHub could not store the debug artifact. Check Actions storage quota; quota recalculation may lag deletions by 6-12 hours."

      # Tagged builds also publish as a prerelease asset. Release assets do not
      # consume the Actions artifact quota, so a good APK remains retrievable
      # even when upload-artifact is temporarily blocked by quota accounting.
      - name: Publish tagged APK prerelease
        if: startsWith(github.ref, 'refs/tags/androidklipper-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          out="AndroidKlipper-${GITHUB_REF_NAME}.apk"
          cp "$apk" "$out"
          sha="$(sha256sum "$out" | awk '{print $1}')"
          {
            echo "Debug APK built from commit ${GITHUB_SHA}."
            echo
            echo "SHA256: ${sha}"
            echo
            echo "Klipper engine remains pinned by the repository vendor scripts; MCU firmware is not flashed automatically."
          } > release-notes.txt
          gh release create "$GITHUB_REF_NAME" "$out" \
            --prerelease \
            --title "AndroidKlipper ${GITHUB_REF_NAME}" \
            --notes-file release-notes.txt
