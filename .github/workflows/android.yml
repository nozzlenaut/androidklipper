name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK/NDK pieces
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Keep the generated debug signing key stable across CI runs. This is a
      # development-only key, but caching it lets later APKs update in place
      # instead of forcing an uninstall/reinstall every build.
      - name: Restore debug signing key
        id: debug-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: androidklipper-debug-keystore-v1

      - name: Create debug signing key on first run
        if: steps.debug-signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Verify debug signing key
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            | grep -E 'Owner:|SHA256:'

      - name: Vendor pinned Klipper
        run: bash scripts/vendor-klipper.sh

      - name: Vendor pinned Moonraker
        run: bash scripts/vendor-moonraker.sh

      - name: Static project checks
        run: python3 scripts/check-project.py

      - name: Unit tests and debug APK
        run: gradle --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Inspect packaged APK
        run: bash scripts/inspect-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: androidklipper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Keep only a few recent APKs so Actions storage does not quietly fill up.
      - name: Clean old Android build artifacts
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 3;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                name: 'androidklipper-debug-apk'
              }
            );

            const recent = artifacts
              .filter((artifact) => !artifact.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            core.info(`Found ${recent.length} AndroidKlipper APK artifacts; keeping ${keep}.`);

            for (const artifact of recent.slice(keep)) {
              core.info(`Deleting artifact ${artifact.id} from ${artifact.created_at}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }
