name: Android build

on:
  push:
    branches: [main, pico2w-bridge-poc]
    tags: ['androidklipper-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Keep one existing APK. GitHub quota accounting can lag deleted artifacts by hours.
      - name: Clean old Android build artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 1;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                name: 'androidklipper-debug-apk'
              }
            );

            const recent = artifacts
              .filter((artifact) => !artifact.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            core.info(`Found ${recent.length} AndroidKlipper APK artifacts; keeping ${keep} before this build.`);

            for (const artifact of recent.slice(keep)) {
              core.info(`Deleting artifact ${artifact.id} from ${artifact.created_at}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }

  build:
    needs: cleanup-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK/NDK pieces
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Keep the generated debug signing key stable across CI runs. This is a
      # development-only key, but caching it lets later APKs update in place
      # instead of forcing an uninstall/reinstall every build.
      - name: Restore debug signing key
        id: debug-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: androidklipper-debug-keystore-v1

      - name: Create debug signing key on first run
        if: steps.debug-signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Verify debug signing key
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            | grep -E 'Owner:|SHA256:'

      - name: Vendor pinned Klipper
        run: bash scripts/vendor-klipper.sh

      - name: Vendor pinned Moonraker
        run: bash scripts/vendor-moonraker.sh

      - name: Static project checks
        run: python3 scripts/check-project.py

      - name: Unit tests and debug APK
        run: gradle --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Inspect packaged APK
        run: bash scripts/inspect-apk.sh

      - name: Upload debug APK
        id: upload-debug-apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: androidklipper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Warn if GitHub artifact quota blocked upload
        if: steps.upload-debug-apk.outcome == 'failure'
        run: |
          echo "::warning::APK build/tests/inspection passed, but GitHub could not store the debug artifact. Check Actions storage quota; quota recalculation may lag deletions by 6-12 hours."

      # Tagged builds also publish as a prerelease asset. Release assets do not
      # consume the Actions artifact quota, so a good APK remains retrievable
      # even when upload-artifact is temporarily blocked by quota accounting.
      - name: Publish tagged APK prerelease
        if: startsWith(github.ref, 'refs/tags/androidklipper-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          out="AndroidKlipper-${GITHUB_REF_NAME}.apk"
          cp "$apk" "$out"
          sha="$(sha256sum "$out" | awk '{print $1}')"
          {
            echo "Debug APK built from commit ${GITHUB_SHA}."
            echo
            echo "SHA256: ${sha}"
            echo
            echo "Klipper engine remains pinned by the repository vendor scripts; MCU firmware is not flashed automatically."
          } > release-notes.txt
          gh release create "$GITHUB_REF_NAME" "$out" \
            --prerelease \
            --title "AndroidKlipper ${GITHUB_REF_NAME}" \
            --notes-file release-notes.txt


  pico2w-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Checkout Pico SDK 2.3.1
        run: |
          git clone --depth 1 --branch 2.3.1 https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --recursive --depth 1

      - name: Build Pico W bridge firmware
        run: |
          cmake -S bridge/pico2w -B bridge/pico2w/build             -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"             -DPICO_BOARD=pico_w
          cmake --build bridge/pico2w/build -j2

      - name: Show bridge firmware files
        run: |
          ls -lh bridge/pico2w/build/androidklipper_bridge.*

      - name: Upload Pico W bridge UF2
        uses: actions/upload-artifact@v4
        with:
          name: androidklipper-picow-bridge
          path: bridge/pico2w/build/androidklipper_bridge.uf2
          if-no-files-found: error
          retention-days: 3
