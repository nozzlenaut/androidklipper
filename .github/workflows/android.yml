name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK/NDK pieces
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Vendor pinned Klipper
        run: bash scripts/vendor-klipper.sh

      - name: Static project checks
        run: python3 scripts/check-project.py

      - name: Unit tests and debug APK
        run: gradle --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: androidklipper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
