name: Pico W bridge build

on:
  push:
    branches: [pico2w-bridge-poc]
    paths:
      - 'bridge/**'
      - '.github/workflows/pico2w-bridge.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Checkout Pico SDK 2.3.1
        run: |
          git clone --depth 1 --branch 2.3.1 https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --recursive --depth 1

      - name: Build pico_w
        run: |
          cmake -S bridge/pico2w -B bridge/pico2w/build-pico_w \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DPICO_BOARD=pico_w
          cmake --build bridge/pico2w/build-pico_w -j2
          cp bridge/pico2w/build-pico_w/androidklipper_bridge.uf2 \
             androidklipper_bridge-pico_w.uf2

      - name: Build pico_w diagnostic
        run: |
          cmake -S bridge/pico2w -B bridge/pico2w/build-pico_w-diag \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DPICO_BOARD=pico_w \
            -DAK_USB_DIAGNOSTIC=ON
          cmake --build bridge/pico2w/build-pico_w-diag -j2
          cp bridge/pico2w/build-pico_w-diag/androidklipper_bridge.uf2 \
             androidklipper_bridge-pico_w-diag.uf2

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: androidklipper-bridge-pico_w
          path: androidklipper_bridge-pico_w.uf2
          if-no-files-found: error
          retention-days: 3

      - name: Upload diagnostic UF2
        uses: actions/upload-artifact@v4
        with:
          name: androidklipper-bridge-pico_w-diag
          path: androidklipper_bridge-pico_w-diag.uf2
          if-no-files-found: error
          retention-days: 3
